<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="ISO-8859-1">
<title>AppTrip</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
	rel="stylesheet"
	integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3"
	crossorigin="anonymous">
</head>
<body>
	<h1>Trips en El Salvador</h1>
	<table class="table table-hover">
		<tr>
			<td>Logo</td>
			<td>Id</td>
			<td>Nombre</td>
			<td>Fecha Publicacion</td>
			<td>Costo</td>
			<td>Descripcion</td>
			<td>Destacado</td>
			<th>Detalle</th>
			<th>Eliminar</th>
		</tr>
		<tr th:each="trip : ${trips}">
	  		<td>
	  			<img th:src="@{/images/{img} (img=${trip.imagen})}" width="100" height="100" >
	  		</td>
			<td th:text="${trip.id}"></td>
			<td th:text="${trip.nombre}"></td>
			<td th:text="${trip.fecha}"></td>
			<td th:text="${trip.costo}"></td>
			<td th:text="${trip.descripcion}"></td>
			<!-- <td th:text="${trip.destacado ==1 ? 'Si' : 'No'}"></td> -->
			<td><span th:if="${trip.destacado==1}" class="badge bg-success">SI</span>
				<span th:unless="${trip.destacado==1}" class="badge bg-danger">NO</span>
			</td>
			<td>
				<a th:href="@{/trips/view/{id} (id=${trip.id}) }" class="btn btn-success" >Detalle</a>
			</td>
			<td>
	    		<a th:href="@{/trips/delete(id=${trip.id}) }" class="btn btn-danger" >Eliminar</a>
	    	</td>
		</tr>

	</table>
	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"
		integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p"
		crossorigin="anonymous"></script>

</body>
</html>
